name: release

# Stages the public npm packages; a person approves each staged version with 2FA before it goes
# live (npmjs.com → Staged Packages, or `npm stage approve <id>`). Manual only: the owner starts it
# from the Actions tab after `pnpm release:version` is merged into main. It holds no npm token: each
# package trusts this workflow for `npm stage publish` only (npm trusted publishing, RELEASING.md),
# and npm records "GitHub Actions" as the publisher instead of a person. The first release of a new
# package is published from a workstation, because npm can trust a workflow only for an existing
# package. npm adds provenance by itself once this repository is public; a private repository
# cannot have it.
on:
  workflow_dispatch:

permissions:
  contents: write # push the tags of the staged versions
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No environment: GitHub Free has none for private repositories. When the repository is public,
    # add `environment: npm` with a required reviewer, and the same name to each trusted publisher.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm 11.21 (`npm stage` needs 11.19 or later)
        run: npm install --global npm@11.21.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check and stage (clean build, typecheck, tests, README samples, tarball checks)
        run: pnpm release:stage
      - name: Push the tags of the staged versions
        run: git push origin --tags
